name: Compilar Mi Isla Dinamica Personalizada

on:
  push:
    branches: [ "principal", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java moderno en la nube
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Descomprimir mi codigo modificado
      run: |
        if [ -f app.zip ]; then
          unzip -o app.zip
        fi

    - name: Fabricar herramientas de Gradle
      run: |
        mkdir -p gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Dar permisos de ejecucion
      run: chmod +x gradlew

    - name: Compilar APK Modificado
      run: ./gradlew assembleDebug

    - name: Entregar Archivo APK Terminado
      uses: actions/upload-artifact@v4
      with:
        name: Mi-Isla-Dinamica-Modificada-APK
        path: app/build/outputs/apk/debug/app-debug.apk
